# Dataset-specific loading and alignment rules. Source selection is owned by aqforecast_config.yaml.

datasets:
  ground_monitors:
    source_key: "ground_monitors"
    file_template: "{provider}_{region_code}_{month_string}_point_h.csv"
    variables: ["site_id", "lat", "lon", "time", "PM2.5", "NO2", "O3", "CO", "SO2", "PM10"]
    site_id: "site_id"
    site_coordinate_tolerance: 1.0e-6
    coordinate_names: {latitude: "lat", longitude: "lon", time: "time"}
    time:
      type: "datetime"
      frequency: "1h"
      alignment: "reference_times"
      tolerance: "30m"
      timestamp_convention: "center"
      availability: {mode: "continuous"}
    regridding:
      method: "none"
    storage: {partition: "monthly", format: "csv", catalog_filename: "catalog.json"}
    access: {mode: "remote", temporary_directory: ".tmp"}

  GEOS-CF:
    source_key: "GEOS-CF"
    file_template: "GEOS-CF_{region_code}_{month_string}_grid_025_h.nc"
    variables: ["no2", "tropcol_no2", "totcol_no2", "u2m", "v2m", "wndspd_2m", "t2m", "q2m", "rh", "cldtt", "tprec", "troppb", "zl", "zpbl"]
    variable_prefix: "GEOS-CF_"
    coordinate_names: {latitude: "lat", longitude: "lon", time: "time"}
    time: {type: "datetime", frequency: "1h", alignment: "reference_times", tolerance: "30m", timestamp_convention: "center", availability: {mode: "continuous"}}
    regridding: {method: "none", latlon_resolution: 0.25}
    storage: {partition: "monthly", format: "netcdf", catalog_filename: "catalog.json"}
    access: {mode: "local", temporary_directory: ".tmp"}

  TROPOMI:
    source_key: "TROPOMI"
    file_template: "TROPOMI_{region_code}_{month_string}_grid_005_d.nc"
    variables: ["no2", "o3"]
    variable_prefix: "TROPOMI_"
    coordinate_names: {latitude: "lat", longitude: "lon", time: "time"}
    time: {type: "datetime", aggregation: "daily_mean", alignment: "reference_times", tolerance: "12h", timestamp_convention: "median", availability: {mode: "continuous"}}
    regridding: {method: "target_grid", latlon_resolution: 0.05}
    storage: {partition: "monthly", format: "netcdf", catalog_filename: "catalog.json"}
    access: {mode: "remote", temporary_directory: ".tmp"}

  GEMS:
    source_key: "GEMS"
    file_template: "GEMS_{region_code}_{month_string}_grid_008_h.nc"
    variables: ["ColumnAmountNO2Trop", "ColumnAmountNO2"]
    variable_prefix: "GEMS_"
    coordinate_names: {latitude: "lat", longitude: "lon", time: "time"}
    time:
      type: "datetime"
      frequency: "1h"
      alignment: "reference_times"
      tolerance: "30m"
      timestamp_convention: "center"
      availability: {mode: "daily_window", start: "08:00", end: "17:00", timezone: "Asia/Seoul"}
    regridding: {method: "target_grid", latlon_resolution: 0.08}
    storage: {partition: "monthly", format: "netcdf", catalog_filename: "catalog.json"}
    access: {mode: "remote", temporary_directory: ".tmp"}

  TEMPO_NO2:
    source_key: "TEMPO_NO2"
    file_template: "TEMPO_NO2_{region_code}_{month_string}_grid_002_h.nc"
    variables: ["vertical_column_troposphere", "main_data_quality_flag", "eff_cloud_fraction", "solar_zenith_angle", "viewing_zenith_angle"]
    variable_prefix: "TEMPO_NO2_"
    coordinate_names: {latitude: "lat", longitude: "lon", time: "time"}
    time:
      type: "datetime"
      frequency: "1h"
      alignment: "reference_times"
      tolerance: "30m"
      timestamp_convention: "center"
      availability: {mode: "daily_window", start: "07:00", end: "19:00", timezone: "US/Eastern"}
    regridding: {method: "none", latlon_resolution: 0.02}
    storage: {partition: "monthly", format: "netcdf", catalog_filename: "catalog.json"}
    access: {mode: "remote", temporary_directory: ".tmp"}

  TEMPO_O3:
    source_key: "TEMPO_O3"
    file_template: "TEMPO_O3_{region_code}_{month_string}_grid_004_h.nc"
    variables: ["troposphere_ozone_column", "ozone_profile_layer_24", "eff_cloud_fraction", "solar_zenith_angle", "viewing_zenith_angle"]
    variable_prefix: "TEMPO_O3_"
    coordinate_names: {latitude: "lat", longitude: "lon", time: "time"}
    time:
      type: "datetime"
      frequency: "1h"
      alignment: "reference_times"
      tolerance: "30m"
      timestamp_convention: "center"
      availability: {mode: "daily_window", start: "07:00", end: "19:00", timezone: "US/Eastern"}
    regridding: {method: "none", latlon_resolution: 0.04}
    storage: {partition: "monthly", format: "netcdf", catalog_filename: "catalog.json"}
    access: {mode: "remote", temporary_directory: ".tmp"}

  GCAS:
    source_key: "GCAS"
    file_template: "GCAS_{region_code}_{date_string}_grid_001_hourly.nc"
    variables: ["no2_vertical_column_below_aircraft", "model_no2_vertical_column_below_aircraft"]
    variable_prefix: "GCAS_"
    coordinate_names: {latitude: "lat", longitude: "lon", time: "time"}
    time:
      type: "datetime"
      frequency: "1h"
      alignment: "reference_times"
      tolerance: "30m"
      timestamp_convention: "center"
      availability: {mode: "daily_window", start: "08:00", end: "17:00", timezone: "Asia/Seoul"}
    regridding: {method: "target_grid", latlon_resolution: 0.01}
    storage: {partition: "daily", format: "netcdf", catalog_filename: "catalog.json"}
    access: {mode: "remote", temporary_directory: ".tmp"}

  land_cover:
    source_key: "land_cover"
    file_template: "MCD12Q1_{region_code}_{year_string}_grid_0005_a.nc"
    variables: ["LC_Type1"]
    variable_prefix: "MCD12Q1_"
    coordinate_names: {latitude: "lat", longitude: "lon", time: "time"}
    time: {aggregation: "mean_over_time", alignment: "expand_to_reference_times", availability: {mode: "continuous"}}
    regridding: {method: "none", latlon_resolution: 0.005}
    storage: {partition: "yearly", format: "netcdf", catalog_filename: "catalog.json"}
    access: {mode: "remote", temporary_directory: ".tmp"}

  # Complete these definitions as the corresponding data-ingest and
  # preprocessing codes are developed.
  PACE:
    source_key: "PACE"

  VIIRS:
    source_key: "VIIRS"

  GOES-ABI:
    source_key: "GOES-ABI"
