# Credentials template. Copy to config/credentials/credentials.yaml and fill in locally.
# Never commit credentials.yaml; it is ignored by .gitignore.

earthdata:
  username: "<NASA Earthdata username>"
  password: "<NASA Earthdata password>"
openaq:
  api_key: "<OpenAQ API key, or null if not required>"
airnow:
  api_key: "<AirNow API key>"
nccs:
  username: "<NCCS username>"
  project: "<NCCS project or account>"
