# Air-quality forecasting behavior. Dataset variables and file names belong in input_data_config.yaml.

inputs:
  ground_monitors:
    enabled: true
    use_as_context: true
    training_fraction: 0.8
  GEOS-CF:
    enabled: true
  TROPOMI:
    enabled: true
  TEMPO_NO2:
    enabled: false
  TEMPO_O3:
    enabled: false
  GEMS:
    enabled: false
  GCAS:
    enabled: false
  land_cover:
    enabled: true

forecast:
  lead_times_hours: [1, 3, 6, 12, 24, 48, 72]
  output_variables: ["pm25", "o3", "no2"]
  confidence_levels: [0.5, 0.9]

feature_engineering:
  input_lags_hours: {}
  additional_features:
    - "time_of_day"

database:
  default_conflict_policy: "fill_missing"
  update_enabled_inputs_by_default: true
