name: chemml
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy>=1.24
  # Required by the partitioned database manager and point-data handling.
  - pandas>=2.0
  - xarray>=2023.1
  - dask
  # NetCDF backend used for gridded database partitions.
  - netcdf4>=1.6
  - scipy
  - matplotlib
  - cartopy
  - pip
  - yamllint
  - pip:
    - earthaccess>=0.8
    - deepsensor
    - torch>=2.0
    # Required by aqforecast/config_management/configuration.py and its tests.
    - pyyaml
    - requests
    - pytest
    - pytest-cov
    - black
    - flake8
    - mypy
    - bandit
    - safety
