name: chemml
channels:
  - conda-forge
dependencies:
  - python>=3.9
  - numpy>=1.24
  # Required by the partitioned database manager and point-data handling.
  - pandas>=2.0
  - xarray>=2023.1
  - dask
  # NetCDF backend used for gridded database partitions.
  - netcdf4>=1.6
  - scipy
  - matplotlib
  - cartopy
  - pip
  - pip:
    # Only needed for the GOES-ABI data-access system; remove if GOES-ABI is not used.
    - s3fs>=2023.1
    - earthaccess>=0.8
    - pydap>=3.5
    - deepsensor
    - torch>=2.0
    # Required by the runtime configuration and acquisition modules.
    - pyyaml
    - requests
