name: chemml
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - numpy>=1.24
  - xarray>=2023.1
  - dask
  - netcdf4
  - scipy
  - pandas
  - matplotlib
  - cartopy
  - pip
  - pip:
    - earthaccess>=0.8
    - deepsensor
    - torch>=2.0
    - pyyaml
    - requests
    - pytest
    - pytest-cov
    - black
    - flake8
    - mypy
    - bandit
    - safety