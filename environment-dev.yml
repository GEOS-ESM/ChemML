name: chemml-dev
channels:
  - conda-forge
dependencies:
  # Keep the development environment aligned with the runtime environment.
  - python>=3.9
  - numpy>=1.24
  - pandas>=2.0
  - xarray>=2023.1
  - dask
  - netcdf4>=1.6
  - scipy
  - matplotlib
  - cartopy
  - pip
  - yamllint
  - pip:
    - s3fs>=2023.1
    - earthaccess>=0.8
    - pydap>=3.5
    - deepsensor
    - torch>=2.0
    - pyyaml
    - requests
    # Development and regression-test tools.
    - pytest
    - pytest-cov
    - black
    - flake8
    - mypy
    - bandit
    - safety
